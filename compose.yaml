name: "financial-auto"

services:
  # ------ Initialization -----

  # ------ Data Backend ------
  postgres:
    image: postgres:18-alpine3.22
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fin_asset_tool
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data

  influxdb:
    image: influxdb:3.8.0-core
    container_name: influxdb
    # ports:
    # - 8181:8181
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=false
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
    # volumes:

  # qdrant:
  #   image: qdrant/qdrant:${QDRANT_VERSION}
  #   networks: [document-network]
  #   container_name: qdrant

  # ------ Temporal ------
  restate-services:
    build:
      context: ./services
    container_name: restate-services
    ports:
      - 9080:9080

  restate-server:
    image: docker.restate.dev/restatedev/restate:latest
    container_name: restate-server
    ports:
      - 8080:8080
      - 9070:9070
      - 9071:9071

