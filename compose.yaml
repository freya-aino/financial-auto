# Everything runs through this file (D-034): local infrastructure (spec 60, ports per D-014) and,
# under profile "app", the platform services and the operator UI (D-026, D-035). Images build from ./docker, context = repo root.
# HelixDB runs from the official standalone image (D-033); the CLI-driven `helix push dev` flow is no longer needed.
name: financial-auto

# Shared environment and secrets mount of the Rust services (and the trainer). Defined up here because
# control-api's own `environment` / `volumes` add the Docker socket, which must not spread to the other services (D-060).
x-rust-defaults:
  environment: &rust-env
    FA_CONFIG: /app/config/platform.docker.toml
    FA_SOURCES: /app/config/sources.yaml
    FA_SECRETS: /app/config/secrets.toml
    FA_METRICS_BIND: 0.0.0.0:9100 # GET /metrics, scraped by victoriametrics; host ports 91xx below (D-056)
    RUST_LOG: info
  volumes: &secrets-volume
    - ./config/secrets.toml:/app/config/secrets.toml:ro # git-ignored; create with docker/garage-init.sh (D-045)

services:
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fa
      POSTGRES_PASSWORD: fa
      POSTGRES_DB: fa
    # WAL archiving for point-in-time recovery (spec 60 §6.6): every finished segment is gzipped into
    # the pg-wal-archive volume (docker/postgres/archive-wal.sh); archive_timeout bounds the RPO to 5 min.
    # The entrypoint wrapper hands the fresh archive volume to the postgres user before the image's own
    # entrypoint runs. pg_hba.conf adds network replication for the backup sidecar's pg_basebackup.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /wal-archive && chown postgres:postgres /wal-archive && chmod 700 /wal-archive && exec docker-entrypoint.sh \"$$@\"", "postgres-wal"]
    command: ["postgres", "-c", "hba_file=/etc/postgresql/fa/pg_hba.conf", "-c", "wal_level=replica",
              "-c", "archive_mode=on", "-c", "archive_command=sh /etc/postgresql/fa/archive-wal.sh %p %f",
              "-c", "archive_timeout=300", "-c", "max_wal_senders=10"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - pg-wal-archive:/wal-archive
      - ./docker/postgres:/etc/postgresql/fa:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fa -d fa"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  helix:
    image: ghcr.io/helixdb/helixdb:v0.0.14
    environment:
      HELIX_DATA_DIR: /var/lib/helix # native on-disk persistence (unset together with S3_BUCKET = memory only)
      RUST_LOG: server=info,db=info
    ports:
      - "127.0.0.1:6969:8080" # container listens on 8080; host port per D-014
    volumes:
      - helix-data:/var/lib/helix
    # distroless image: no shell or curl, so no in-container healthcheck.
    # From the host: curl -fsS http://127.0.0.1:6969/healthz (and /readyz).
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=100y" # per-timescale retention is enforced by our writers (spec 20)
      - "-httpListenAddr=:8428"
      - "-promscrape.config=/etc/vm-scrape.yaml" # scrapes every service's /metrics (spec 60 §4, D-056)
      - "-promscrape.config.strictParse=false"
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - vm-data:/storage
      - ./docker/vm-scrape.yaml:/etc/vm-scrape.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.5.0
    ports:
      - "127.0.0.1:3900:3900" # S3 API
      - "127.0.0.1:3903:3903" # admin API
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck: # the image is the static binary only; `garage status` talks RPC to the local node
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── ops: alerting, exporters, backups (spec 60 §6.5, §6.6) ───────────────

  # Evaluates docker/vm-alerts.yaml every 30 s against VictoriaMetrics and notifies control-api as an
  # Alertmanager (POST /api/alerts/vmalert/api/v2/alerts) → NATS `ops.alert` + audit.log. ALERTS /
  # ALERTS_FOR_STATE series are written back to VictoriaMetrics, which restores `for:` state on restart.
  # UI: http://127.0.0.1:8880 (rules, active alerts). Reload rules: docker compose kill -s HUP vmalert.
  vmalert:
    image: victoriametrics/vmalert:v1.155.0
    command:
      - "-rule=/etc/vmalert/rules.yaml"
      - "-datasource.url=http://victoriametrics:8428"
      - "-remoteWrite.url=http://victoriametrics:8428"
      - "-remoteRead.url=http://victoriametrics:8428"
      - "-notifier.url=http://control-api:7700/api/alerts/vmalert"
      - "-evaluationInterval=30s"
      - "-external.url=http://127.0.0.1:8880"
      - "-httpListenAddr=:8880"
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - ./docker/vm-alerts.yaml:/etc/vmalert/rules.yaml:ro
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8880/health"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # NATS server + JetStream stream/consumer metrics (:8222 is JSON only) → scraped as job "nats".
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.17.3
    command: ["-varz", "-connz", "-jsz=all", "-healthz", "-port", "7777", "http://nats:8222"]
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # Postgres server metrics (connections, database size, WAL, locks) → scraped as job "postgres".
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://fa:fa@postgres:5432/fa?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Scheduled backups inside compose (spec 60 §6.6, replaces the host crontab line): busybox crond runs
  # docker/backup/run.sh at FA_BACKUP_SCHEDULE (PITR base backup + pg_dump + hot Helix tar + Garage
  # buckets → ./backups/<ts>/, retention FA_BACKUP_KEEP, WAL pruning), the Postgres restore drill
  # weekly (scratch clusters inside this container only) and WAL-archiver metrics every 5 min.
  # Manual: docker compose exec backup run.sh | drill-postgres.sh /backups/<ts> | prune.sh
  backup:
    build:
      context: ./docker/backup
    image: financial-auto/backup:dev
    environment:
      TZ: ${FA_BACKUP_TZ:-UTC}
      FA_BACKUP_SCHEDULE: ${FA_BACKUP_SCHEDULE:-0 3 * * *} # backup.schedule (spec 60 §7)
      FA_DRILL_SCHEDULE: ${FA_DRILL_SCHEDULE:-30 4 * * 0}
      FA_BACKUP_KEEP: ${FA_BACKUP_KEEP:-7}
      FA_BACKUP_BUCKETS: fa-models fa-ckpt fa-artifacts fa-backup
      FA_SECRETS: /run/fa/secrets.toml
      PGHOST: postgres
      PGUSER: fa
      PGPASSWORD: fa
      PGDATABASE: fa
      # Off-machine copy hook — configured but disabled (external targets are out of scope, spec 60 §10 Q4).
      # Enable with an rclone remote configured through RCLONE_CONFIG_<NAME>_* env vars.
      FA_BACKUP_OFFSITE_ENABLED: ${FA_BACKUP_OFFSITE_ENABLED:-0}
      FA_BACKUP_OFFSITE_REMOTE: ${FA_BACKUP_OFFSITE_REMOTE:-}
    volumes:
      - ./backups:/backups
      - pg-wal-archive:/wal-archive # read by the drill, pruned by prune.sh
      - helix-data:/helix:ro
      - ./config/secrets.toml:/run/fa/secrets.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5m # the first start may run a full backup before crond
    restart: unless-stopped

  # ── application services (profile "app", D-026) ─────────────────────────
  # Build: docker compose --profile app build
  # GPU (needs nvidia-container-toolkit): uncomment the `deploy.resources` blocks below.

  control-api:
    profiles: ["app"]
    build: &rust-build
      context: .
      dockerfile: docker/rust.Dockerfile
    image: financial-auto/rust:dev
    command: ["control-api"]
    environment:
      <<: *rust-env
      FA_COMPOSE_PROJECT: financial-auto # compose project whose containers the supervisor may act on (D-060)
    volumes:
      - ./config/secrets.toml:/app/config/secrets.toml:ro
      # Service supervision (spec 50 §4.1, D-060): the Docker socket, read-write, mounted into control-api ONLY.
      # Rootless Docker: export FA_DOCKER_SOCK=$XDG_RUNTIME_DIR/docker.sock (or put it in .env, see docker/README.md).
      - ${FA_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    # The image runs as uid 10001 (docker/rust.Dockerfile); the socket is root:docker (rootful) or, under rootless
    # Docker, 0:<docker gid inside the daemon's user namespace>, so the container user joins that group instead of
    # running as root. FA_DOCKER_GID = `stat -c %g` of the socket as the daemon sees it
    # (rootless: `docker run --rm -v $FA_DOCKER_SOCK:/s alpine stat -c %g /s`).
    group_add:
      - "${FA_DOCKER_GID:-999}"
    ports:
      - "127.0.0.1:7700:7700"
      - "127.0.0.1:9101:9100" # metrics
    depends_on: &core-deps
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      helix:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  ui:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    image: financial-auto/ui:dev
    ports:
      - "127.0.0.1:8080:8080" # operator UI; proxies /api and /ws to control-api (D-035)
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  model-runtime:
    profiles: ["app"]
    image: financial-auto/rust:dev
    command: ["model-runtime"]
    environment: *rust-env
    volumes: *secrets-volume
    ports:
      - "127.0.0.1:9102:9100" # metrics
    depends_on: *core-deps
    healthcheck: # GET /metrics answers ⇒ process up, HTTP loop alive (spec 60 §6.4)
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  strategy-runtime:
    profiles: ["app"]
    image: financial-auto/rust:dev
    command: ["strategy-runtime"]
    environment: *rust-env # FA_STRATEGIES=<file> for a non-baseline population
    volumes: *secrets-volume
    ports:
      - "127.0.0.1:9103:9100" # metrics
    depends_on: *core-deps
    healthcheck: # GET /metrics answers ⇒ process up, HTTP loop alive (spec 60 §6.4)
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    restart: unless-stopped

  risk-engine:
    profiles: ["app"]
    image: financial-auto/rust:dev
    command: ["risk-engine"]
    environment:
      <<: *rust-env
      FA_RISK: /app/risk.toml
    volumes:
      - ./bins/risk-engine/risk.toml:/app/risk.toml:ro # limits editable without a rebuild (D-041)
      - ./config/secrets.toml:/app/config/secrets.toml:ro
    ports:
      - "127.0.0.1:9104:9100" # metrics
    depends_on: *core-deps
    healthcheck: # GET /metrics answers ⇒ process up, HTTP loop alive (spec 60 §6.4)
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    restart: unless-stopped

  evo-worker:
    profiles: ["app"]
    image: financial-auto/rust:dev
    command: ["evo-worker"]
    environment: *rust-env
    volumes: *secrets-volume
    ports:
      - "127.0.0.1:9110-9119:9100" # metrics; a range so up to 10 replicas can publish (scrape uses DNS inside compose)
    depends_on: *core-deps
    healthcheck: # GET /metrics answers ⇒ process up, HTTP loop alive (spec 60 §6.4)
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    restart: unless-stopped
    # Scale with: docker compose --profile app up -d --scale evo-worker=N
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ingestor:
    profiles: ["app"]
    build: &go-build
      context: .
      dockerfile: docker/go.Dockerfile
    image: financial-auto/go:dev
    entrypoint: ["ingestor"]
    # Keyless live sources + the synthetic heartbeat (D-050); add lemon/oanda once keys are in config/secrets.toml.
    command: ["-nats", "nats://nats:4222", "-catalog", "/app/config/sources.yaml", "-connectors", "heartbeat,yahoo,hackernews,google_news,frankfurter,ecb,gdelt,sec_edgar,kraken",
              "-tsdb-url", "http://victoriametrics:8428", "-postgres", "postgres://fa:fa@postgres:5432/fa", "-garage", "http://garage:3900"]
    volumes: *secrets-volume
    environment:
      FA_SECRETS: /app/config/secrets.toml
      FA_METRICS_BIND: 0.0.0.0:9100
      FA_ARCHIVE_SPOOL: /tmp/fa-raw-spool # raw-archive spool while Garage is down (spec 10 §8)
    ports:
      - "127.0.0.1:9105:9100" # metrics
    depends_on:
      victoriametrics:
        condition: service_healthy
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck: # distroless image: go/services/healthprobe does the GET (spec 60 §6.4)
      test: ["CMD", "healthprobe", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 20s
    restart: unless-stopped

  broker-gateway:
    profiles: ["app"]
    image: financial-auto/go:dev
    entrypoint: ["broker-gateway"]
    command: ["-nats", "nats://nats:4222"]
    volumes: *secrets-volume
    environment:
      FA_SECRETS: /app/config/secrets.toml
      FA_METRICS_BIND: 0.0.0.0:9100
    ports:
      - "127.0.0.1:9106:9100" # metrics
    depends_on:
      nats:
        condition: service_healthy
    healthcheck: # distroless image: go/services/healthprobe does the GET (spec 60 §6.4)
      test: ["CMD", "healthprobe", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 20s
    restart: unless-stopped

  evo-orchestrator:
    profiles: ["app"]
    image: financial-auto/go:dev
    entrypoint: ["evo-orchestrator"]
    command: ["-nats", "nats://nats:4222"]
    environment:
      FA_GPU_MEM_MB: "24000" # reported as gpu.capacity_mb (D-031); set to the real card
      FA_SECRETS: /app/config/secrets.toml
      FA_GARAGE_URL: http://garage:3900 # strategy promotion artifacts (D-052)
      FA_METRICS_BIND: 0.0.0.0:9100
    volumes: *secrets-volume
    ports:
      - "127.0.0.1:9107:9100" # metrics
    depends_on:
      nats:
        condition: service_healthy
    healthcheck: # distroless image: go/services/healthprobe does the GET (spec 60 §6.4)
      test: ["CMD", "healthprobe", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 20s
    restart: unless-stopped

  # One-off CLI, not started by default:
  #   docker compose --profile tools run --rm trainer pretrain --help
  trainer:
    profiles: ["tools"]
    image: financial-auto/rust:dev
    build: *rust-build
    entrypoint: ["trainer"]
    environment:
      <<: *rust-env
      FA_METRICS_BIND: "off" # one-off CLI, nothing to scrape
    volumes: *secrets-volume
    depends_on: *core-deps
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pg-wal-archive: # archived WAL for PITR (spec 60 §6.6), pruned by the backup sidecar
  nats-data:
  helix-data:
  postgres-data:
  vm-data:
  garage-meta:
  garage-data:
