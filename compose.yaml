# Everything runs through this file (D-034): local infrastructure (spec 60, ports per D-014) and,
# under profile "app", the platform services and the operator UI (D-026, D-035). Images build from ./docker, context = repo root.
# HelixDB runs from the official standalone image (D-033); the CLI-driven `helix push dev` flow is no longer needed.
name: financial-auto

services:
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fa
      POSTGRES_PASSWORD: fa
      POSTGRES_DB: fa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fa -d fa"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  helix:
    image: ghcr.io/helixdb/helixdb:v0.0.14
    environment:
      HELIX_DATA_DIR: /var/lib/helix # native on-disk persistence (unset together with S3_BUCKET = memory only)
      RUST_LOG: server=info,db=info
    ports:
      - "127.0.0.1:6969:8080" # container listens on 8080; host port per D-014
    volumes:
      - helix-data:/var/lib/helix
    # distroless image: no shell or curl, so no in-container healthcheck.
    # From the host: curl -fsS http://127.0.0.1:6969/healthz (and /readyz).
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=100y" # per-timescale retention is enforced by our writers (spec 20)
      - "-httpListenAddr=:8428"
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - vm-data:/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.5.0
    ports:
      - "127.0.0.1:3900:3900" # S3 API
      - "127.0.0.1:3903:3903" # admin API
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    restart: unless-stopped

  # ── application services (profile "app", D-026) ─────────────────────────
  # Build: docker compose --profile app build
  # GPU (needs nvidia-container-toolkit): uncomment the `deploy.resources` blocks below.

  control-api:
    profiles: ["app"]
    build: &rust-build
      context: .
      dockerfile: docker/rust.Dockerfile
    image: financial-auto/rust:dev
    command: ["control-api"]
    environment: &rust-env
      FA_CONFIG: /app/config/platform.docker.toml
      FA_SOURCES: /app/config/sources.yaml
      FA_SECRETS: /app/config/secrets.toml
      RUST_LOG: info
    volumes: &secrets-volume
      - ./config/secrets.toml:/app/config/secrets.toml:ro # git-ignored; create with docker/garage-init.sh (D-045)
    ports:
      - "127.0.0.1:7700:7700"
    depends_on: &core-deps
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      helix:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  ui:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    image: financial-auto/ui:dev
    ports:
      - "127.0.0.1:8080:8080" # operator UI; proxies /api and /ws to control-api (D-035)
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  model-runtime:
    profiles: ["app"]
    image: financial-auto/rust:dev
    command: ["model-runtime"]
    environment: *rust-env
    volumes: *secrets-volume
    depends_on: *core-deps
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  strategy-runtime:
    profiles: ["app"]
    image: financial-auto/rust:dev
    command: ["strategy-runtime"]
    environment: *rust-env # FA_STRATEGIES=<file> for a non-baseline population
    volumes: *secrets-volume
    depends_on: *core-deps
    restart: unless-stopped

  risk-engine:
    profiles: ["app"]
    image: financial-auto/rust:dev
    command: ["risk-engine"]
    environment:
      <<: *rust-env
      FA_RISK: /app/risk.toml
    volumes:
      - ./bins/risk-engine/risk.toml:/app/risk.toml:ro # limits editable without a rebuild (D-041)
      - ./config/secrets.toml:/app/config/secrets.toml:ro
    depends_on: *core-deps
    restart: unless-stopped

  evo-worker:
    profiles: ["app"]
    image: financial-auto/rust:dev
    command: ["evo-worker"]
    environment: *rust-env
    volumes: *secrets-volume
    depends_on: *core-deps
    restart: unless-stopped
    # Scale with: docker compose --profile app up -d --scale evo-worker=N
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ingestor:
    profiles: ["app"]
    build: &go-build
      context: .
      dockerfile: docker/go.Dockerfile
    image: financial-auto/go:dev
    entrypoint: ["ingestor"]
    # Keyless live sources + the synthetic heartbeat (D-050); add lemon/oanda once keys are in config/secrets.toml.
    command: ["-nats", "nats://nats:4222", "-catalog", "/app/config/sources.yaml", "-connectors", "heartbeat,yahoo,hackernews,google_news",
              "-tsdb-url", "http://victoriametrics:8428", "-postgres", "postgres://fa:fa@postgres:5432/fa", "-garage", "http://garage:3900"]
    volumes: *secrets-volume
    environment:
      FA_SECRETS: /app/config/secrets.toml
    depends_on:
      victoriametrics:
        condition: service_healthy
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  broker-gateway:
    profiles: ["app"]
    image: financial-auto/go:dev
    entrypoint: ["broker-gateway"]
    command: ["-nats", "nats://nats:4222"]
    volumes: *secrets-volume
    environment:
      FA_SECRETS: /app/config/secrets.toml
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  evo-orchestrator:
    profiles: ["app"]
    image: financial-auto/go:dev
    entrypoint: ["evo-orchestrator"]
    command: ["-nats", "nats://nats:4222"]
    environment:
      FA_GPU_MEM_MB: "24000" # reported as gpu.capacity_mb (D-031); set to the real card
      FA_SECRETS: /app/config/secrets.toml
      FA_GARAGE_URL: http://garage:3900 # strategy promotion artifacts (D-052)
    volumes: *secrets-volume
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # One-off CLI, not started by default:
  #   docker compose --profile tools run --rm trainer pretrain --help
  trainer:
    profiles: ["tools"]
    image: financial-auto/rust:dev
    build: *rust-build
    entrypoint: ["trainer"]
    environment: *rust-env
    volumes: *secrets-volume
    depends_on: *core-deps
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  nats-data:
  helix-data:
  postgres-data:
  vm-data:
  garage-meta:
  garage-data:
