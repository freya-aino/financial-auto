# risk-engine settings (spec 40). Hard limits are loaded from here only; the bus can never
# loosen them. Values follow the spec 40 §7 placeholders unless noted.

mode = "paper"              # the only mode that exists (D-029)
account = "paper"           # order.intent.paper / order.approved.paper / order.event.paper
starting_cash_eur = 100000  # D-028
allocator = "equal_weight"  # equal-risk control allocator (spec 40 §6.2); risk_parity | fractional_kelly | thompson_rp also available
max_strategy_weight = 0.5
kelly_fraction = 0.25
performance_decay = 0.95
signal_ttl_secs = 60
no_trade_band_frac = 0.005  # exec.no_trade_band
min_order_eur = 25.0
default_asset_class = "equity" # instruments without reference data (ref.instrument) are treated as equities (counted: refdata.unknown)
refdata_refresh_secs = 300  # reload ref.instrument/listing/venue (asset class, venue, quote ccy, status, source); also on ref.changed.* / ingest.unresolved.*
volume_window_secs = 3600   # traded volume window behind the liquidity cap
pending_ttl_secs = 10
snapshot_secs = 60          # ledger.position_snapshot + ledger.strategy_state cadence when [postgres] is reachable (also on halt)
reconcile_secs = 300        # in-memory book vs Postgres-derived book → ledger.reconciliation_run; a diff HALTS scope `broker` (spec 42)

# EUR accounting FX (spec 42 §6, spec 12 §6/§7; D-061). Marks and fills are converted from the
# instrument's quote currency (ref.instrument.quote_ccy; unknown = EUR) as of the event time with
# the latest ref.fx_rate row of `source` at or before it. The engine fetches the ECB daily
# reference rates itself and upserts them idempotently on (ccy, ts, source_id). Without
# Postgres the table is empty and every conversion is 1.0 (D-028 behaviour).
[fx]
ecb_refresh_secs = 86400    # https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml (TARGET working days ~16:00 CET)
max_age_hours = 72          # rate older than this at the event time → `stale` flag + fx.stale counter (long weekends briefly trip it)
halt_on_stale = false       # true: reduce-only halt scope `fx` while any used currency is stale (spec 42 §8); false: warning only
source = "ecb_daily"        # fx.accounting_source
history_days = 60           # rates loaded into memory at start (older fills use the earliest known rate, flagged stale)
block_stale_ccy = true      # a stale currency is reduce-only (its instruments' targets and foreign orders); others trade on (spec 42 §8)
intraday = true             # trades of EUR FX pairs in ref data (Yahoo EURUSD=X) are intraday rates → table + ref.fx_rate (source = feed id)
intraday_max_dev = 0.05     # intraday rate dropped when > 5 % off the latest daily rate (bad tick)

# Strategy lifecycle (spec 40 §3, §6.6; D-051). A strategy first seen on signal.exposure.<id> gets
# `new_strategy_status`: "active" allocates paper capital at once (baseline behaviour), "shadow"
# tracks a virtual book only until `promote` passes the gate. Status is persisted in
# ledger.strategy_state and controlled through ctl.risk.strategy (pause|resume|flatten|promote|shadow|retire|admit).
new_strategy_status = "active"
shadow_sleeve_eur = 10000   # virtual capital behind a shadow strategy's book (spec 41 §6.6)

tournament_cost_bps = 5     # live paper allocator tournament: cost charged on weight turnover (spec 40 §6.2)

[promotion]                 # gate (spec 40 §6.6, §7): all must hold; unknown statistics block promotion
min_shadow_days = 30        # promotion.min_shadow_days
min_horizons = 20           # promotion.min_horizons completed in shadow
min_deflated_sharpe = 0.0   # deflated Sharpe of the holdout trial (else the registry's) must exceed this
max_pbo = 0.2               # spec 41 pbo.max_for_promotion: PBO of the strategy's generation (n/a for hand-written strategies)
consistency_z = 2.0         # shadow Sharpe/h may sit at most z standard errors below the backtest's (n/a for hand-written)

# Automatic evolved-strategy lifecycle (spec 35 §6.4): candidate → holdout → shadow → active →
# retired, driven every interval_secs (and by ctl.risk.pipeline {action: run}). Paper only.
[pipeline]
enabled = true
interval_secs = 60
generations_scanned = 20    # newest fa-artifacts/strategies/<generation>.toml files read
dsr_min_candidate = 0.95    # spec 35 §7: selection deflated Sharpe (probability) for holdout eligibility
pbo_max = 0.2               # spec 35 §7: a generation above it (or with unknown PBO) promotes no one
max_candidates_per_generation = 3
holdout_min_dsr = 0.95      # spec 41 dsr.min_for_promotion applied to the single holdout trial
holdout_min_obs = 100
holdout_timeout_secs = 1800 # requested evaluation without a trial row → retried
holdout_max_attempts = 2    # then retired
max_live_evolved = 8        # evolved strategies in the live set (shadow + active + paused)
auto_promote = true         # shadow → active when the gate is green (paper)
max_shadow_days = 90        # never promoted after this long → retired
max_demotions = 2           # active → shadow demotions before retirement
decay_min_hours = 24        # hourly book points behind the shadow/live consistency check

# Locked holdouts (spec 41 §6.4, §7): kept per timescale automatically. Each is the latest completed
# segment at lock time; it is only locked when VictoriaMetrics holds ≥ min_bars bars in it, otherwise
# reported as missing (heartbeat holdout.missing, ctl.risk.pipeline status) and retried.
[holdout]
auto_lock = true
check_secs = 300
timescales = ["1s", "1m"]   # the baselines' and evolution's timescales; candidates add theirs on demand
min_bars = 300
relock_after_days = 7       # spec 41 Q5: a new full-length segment once the latest ended max(7 d, its length) ago (0 = never)
[holdout.length_secs]       # holdout.length.<ts> (spec 41 Q1): >= 300 bars and >= 100 non-overlapping horizons of the timescale's strategies
"1s" = 7200
"1m" = 43200
"1h" = 7776000
"1d" = 31536000
[holdout.embargo_secs]      # embargo.<ts>: stored with each lock (validation.holdout.embargo_ms); evo-worker ends selection windows max(this, 2 × horizon, 60 s) before the holdout
"1s" = 300
"1m" = 3600
"1h" = 172800
"1d" = 864000

# Per-instrument feed guard (spec 40 §6.5 health halts, §8 bad tick): reduce-only while frozen.
[feed]
stale_freeze_bars = 3       # risk.feed_stale_freeze: × max(fastest strategy bar, the instrument's own trade gap)
stale_freeze_min_secs = 3
stale_flatten_secs = 0      # second threshold: flatten after this long without a trade (0 = keep positions)
jump_max = 0.15             # |log return| vs the mark held back as a possible bad tick …
jump_confirm = 3            # … until this many trades confirm the new level

# Runtime changes through ctl.risk.limits / PUT /api/trading/limits may only TIGHTEN these
# (lower every cap, raise the payout reserve); loosening needs an edit here + restart (spec 40 §6.5).
[limits]
max_drawdown = 0.10         # risk.portfolio_max_drawdown → kill switch, manual re-arm
strategy_max_drawdown = 0.05 # risk.strategy_max_drawdown: attributed P&L drawdown vs sleeve → pause + flatten that strategy
max_daily_loss = 0.02       # risk.daily_loss_limit → reduce-only until the losing day ends (UTC for 24/7 venues, the exchange day per calendar; spec 40 §10 Q4)
max_position_frac = 0.05    # risk.max_position_pct per instrument
# provisional_position_frac = 0.025 # per instrument whose ref.instrument.status is `provisional` (D-050); default = max_position_frac × 0.5, never above it
max_class_frac = 0.40       # risk.max_class_pct: gross per asset class / deployable
max_venue_frac = 0.50       # risk.max_venue_pct: gross per venue / deployable (counterparty risk)
portfolio_gross_cap = 2.0   # risk.portfolio_gross_cap: total gross / deployable
liquidity_k = 0.01          # |position| ≤ k × horizon volume (EUR)
max_order_frac = 0.10       # pre-trade (manual / foreign orders): notional ≤ this × deployable (fat finger)
limit_price_band = 0.10     # pre-trade: limit price within ±10 % of the mark
daily_payout_quota_eur = 0  # floor of the reserve; the [payout] rule writes today's ledger.payout_quota row; the larger is reserved
                            # (deployable = equity − reserve); ctl.risk.limits {set: {daily_payout_quota_eur}} raises both (tighten-only)
short_margin_budget_frac = 0.5 # Σ |short| × short_margin(class) ≤ this × deployable (spec 40 §10 Q5, paper answer)

[limits.leverage_cap]       # risk.gross_leverage_cap.<class>
equity = 1.5
etf = 1.5
fx = 3.0
crypto = 1.0
commodity = 1.0
rates = 1.0
index = 1.0
derivative = 1.0
prediction_market = 1.0

[limits.short_margin]       # initial margin per short as a fraction of its notional; a class absent here cannot be
equity = 0.5                # shorted (no borrow), nor can an instrument whose ref.contract_spec.shortable is false.
etf = 0.5                   # Reg-T style 50 % for cash equities / ETFs
crypto = 1.0                # fully collateralised
fx = 0.05                   # 20:1
index = 0.1
commodity = 0.2
derivative = 0.2            # delta-1 notionals (spec 40 §11)
                            # rates, prediction_market: not shortable

# Execution-algorithm choice per intent (spec 40 §6.4, fa_risk::exec): urgent (halts, flattens) and
# short-horizon (< market_below_horizon_secs) orders cross the spread; otherwise by participation in
# the horizon volume: ≥ pov_participation → pov, ≥ twap_participation with a horizon ≥
# sliced_min_horizon_secs → vwap/twap over half the horizon, else smart_limit (timeout horizon/4,
# 5..smart_limit_timeout_secs); orders under market_below_eur go market.
[exec]
enabled = true
market_below_horizon_secs = 60
market_below_eur = 250
smart_limit_timeout_secs = 30   # exec.smart_limit_timeout
twap_participation = 0.01
pov_participation = 0.05
pov_rate = 0.1
sliced_min_horizon_secs = 600
max_slice_dur_secs = 3600
slice_secs = 30

# Cost-aware rebalancing (spec 40 §6.1 step 6, fa_risk::rebalance). The no-trade band above sat
# far below the paper venue's 1 EUR fee minimum: 2026-11-10 19:00 – 11-11 02:00 the 1 s baselines
# paid ~7 000 EUR of fees on ~7 000 rebalances of ~300 EUR (30–50 bp each). A non-urgent order is
# now sent only when its expected benefit — edge × |Δ| with the trade, risk_aversion × σ_hold ×
# |Δ| for reductions — is ≥ min_benefit_cost_ratio × its full expected cost (commission incl. the
# minimum, half spread, sqrt impact; costs.yaml via FA_COSTS, impact k from exec.costs.calibrated),
# it is ≥ the min order notional commission_min × 1e4 / max_fee_bps (1 000 EUR at a 1 EUR
# minimum), and it stayed worthwhile for confirm_secs (swings between strategies net out first).
# Halts, flattens and limit-bound reductions bypass the cost test. Each strategy may cause at most
# turnover_budget_per_day × its sleeve of traded notional per UTC day; over budget its last
# distribution is netted (frozen) until the day rolls. enabled = false restores the plain band.
[rebalance]
enabled = true
min_benefit_cost_ratio = 1.0  # benefit must cover the full expected cost
prior_edge_bps = 20.0         # edge per holding period of a strategy without track record …
prior_obs = 600.0             # … shrunk with the tracker's observations (ticks) against this weight
max_edge_bps = 200.0
holding_horizons = 1.0        # holding period = this × the contributors' horizon …
min_holding_secs = 60.0       # … at least this (orphans: a day)
risk_aversion = 1.0           # benefit per EUR of shedding one σ_hold of unwanted risk
max_fee_bps = 10.0            # min order notional: the fee minimum costs at most this
turnover_budget_per_day = 20.0 # × sleeve per strategy per UTC day
confirm_secs = 3.0

# Model-drift alarm (spec 40 §6.5): kernel updates on latent.mcmc.* whose occupancy drift_kl stays
# ≥ halt_kl for `sustain` updates raise `model:<snapshot>` — only the strategies of that snapshot's
# timescale pause; ≤ clear_kl for `clear_sustain` updates of every expert clears it (only halts
# this alarm raised; operator/bus halts need risk.resume.model:<snapshot>). halt_kl is 10× the
# adapter-refit trigger (KL > 0.1 × 3, spec 33): refit first, halt only on gross drift.
[model_drift]
enabled = true
halt_kl = 1.0
sustain = 5
clear_kl = 0.25
clear_sustain = 10

# Daily payout quota rule (spec 42 §10 Q1, fa_ledger::payout). At the first check of each UTC day
# the risk-engine computes the quota from the book as of midnight and raises today's
# ledger.payout_quota row to it (never lowers): rule = fixed_eur (amount_eur) | pct_equity |
# pct_profit (pct of the previous day's positive net P&L); rollover carries yesterday's unpaid
# quota; capped at max_equity_frac × previous close equity. The quota is reserved (deployable =
# equity − reserve); booking the payout is an operator action (POST /api/trading/payouts).
[payout]
rule = "fixed_eur"
amount_eur = 0.0
pct = 0.0
rollover = false
max_equity_frac = 0.05

# Risk-chain history (spec 40 §5): allocation snapshots and netted targets (raw / capped / gated,
# decision) in ledger.allocation_snapshot / ledger.portfolio_target, kept on change (an order, a
# weight move > 1e-4, a gated target move > min_order_eur) and at least every snapshot_secs,
# pruned after retention_days; ledger.promotion_review gets every promote attempt and every change
# of a shadow strategy's gate outcome (hourly while unchanged).
[history]
enabled = true
snapshot_secs = 60
retention_days = 30
review_unchanged_secs = 3600
