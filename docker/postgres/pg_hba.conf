# Postgres client authentication for compose (spec 60 §6.6). Mounted read-only and selected with
# `-c hba_file=/etc/postgresql/fa/pg_hba.conf`, so the data directory's own pg_hba.conf (initdb
# default) stays untouched and is what a restored base backup uses.
# The only addition over the image default is the `replication` line for the network: the backup
# sidecar takes base backups with pg_basebackup as user `fa` over the compose network.
# TYPE  DATABASE     USER  ADDRESS        METHOD
local   all          all                  trust
host    all          all   127.0.0.1/32   trust
host    all          all   ::1/128        trust
local   replication  all                  trust
host    replication  all   127.0.0.1/32   trust
host    replication  all   ::1/128        trust
host    replication  fa    all            scram-sha-256
host    all          all   all            scram-sha-256
