# Platform configuration for the Docker Compose app profile (D-026). Mirrors platform.toml with compose hostnames.
# HelixDB is the compose service `helix` (D-033).

timescales = ["1s", "1m", "1h", "1d", "1w"] # D-011

[nats]
url = "nats://nats:4222"

[helix]
url = "http://helix:8080"

[qdrant] # vector store, ADR 0010 / D-101 (the graph stays in [helix])
url = "http://qdrant:6333"
vector_backend = "qdrant" # or "helix" (pre-ADR-0010 HelixDB vector indexes)

[victoriametrics]
url = "http://victoriametrics:8428"

[postgres]
url = "postgres://fa:fa@postgres:5432/fa"

[garage]
endpoint = "http://garage:3900"
public_endpoint = "http://127.0.0.1:3900" # presigned URLs handed to the browser (spec 50 §4.6)
region = "garage"
bucket_raw = "fa-raw"
bucket_media = "fa-media"
bucket_models = "fa-models"
media_downsample_after_d = 30 # spec 20 §6.5: full video → sampled frames after N days

[control_api]
bind = "0.0.0.0:7700"

# Organisational books (D-104; values owner-confirmed 2026-11-15, D-106): of a closed day's
# positive net income, 20% is declared to the owner, 30% feeds the infrastructure fund and the
# remaining 50% stays as trading capital. Opex prices are notional cloud-equivalent estimates
# (dedicated host ~30 EUR/mo amortised; S3-class storage; cloud GPU hourly) to be replaced with
# real invoices when they exist.
[accounting]
owner_frac = 0.2
infra_frac = 0.3
reserve_frac = 0.0
base_eur_per_day = 1.0
gpu_eur_per_hour = 0.5
storage_eur_per_gib_month = 0.02
