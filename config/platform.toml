# Platform configuration (spec 60). Ports per D-014. Secrets go in secrets.toml (git-ignored).

timescales = ["1s", "1m", "1h", "1d", "1w"] # D-011

[nats]
url = "nats://127.0.0.1:4222"

[helix]
url = "http://127.0.0.1:6969"

[qdrant] # vector store, ADR 0010 / D-101 (the graph stays in [helix])
url = "http://127.0.0.1:6333"
vector_backend = "qdrant" # or "helix" (pre-ADR-0010 HelixDB vector indexes)

[victoriametrics]
url = "http://127.0.0.1:8428"

[postgres]
url = "postgres://fa:fa@127.0.0.1:5432/fa"

[garage]
endpoint = "http://127.0.0.1:3900"
region = "garage"
bucket_raw = "fa-raw"
bucket_media = "fa-media"
bucket_models = "fa-models"
media_downsample_after_d = 30 # spec 20 §6.5: full video → sampled frames after N days

[control_api]
bind = "127.0.0.1:7700"

# Organisational books (D-104): split fractions of a closed day's positive net income and
# prices for the system's own metered costs. All zero: no split, no opex, until the owner sets them.
[accounting]
owner_frac = 0.0
infra_frac = 0.0
reserve_frac = 0.0
base_eur_per_day = 0.0
gpu_eur_per_hour = 0.0
storage_eur_per_gib_month = 0.0
