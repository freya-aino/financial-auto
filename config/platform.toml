# Platform configuration (spec 60). Ports per D-014. Secrets go in secrets.toml (git-ignored).

timescales = ["1s", "1m", "1h", "1d", "1w"] # D-011

[nats]
url = "nats://127.0.0.1:4222"

[helix]
url = "http://127.0.0.1:6969"

[victoriametrics]
url = "http://127.0.0.1:8428"

[postgres]
url = "postgres://fa:fa@127.0.0.1:5432/fa"

[garage]
endpoint = "http://127.0.0.1:3900"
region = "garage"
bucket_raw = "fa-raw"
bucket_media = "fa-media"
bucket_models = "fa-models"

[control_api]
bind = "127.0.0.1:7700"
