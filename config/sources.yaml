  - id: kraken
    name: Kraken
    category: crypto_exchange
    capabilities: [data, execution]
    asset_classes: [crypto, crypto_derivative]
    transport: [rest, websocket]
    auth: hmac
    status: live
    tos_notes: "Public market-data endpoints need no key; trading (hmac) not implemented."
    notes: "Verified live 2026-11-11. Keyless public REST: OHLC→Bar, Trades→Trade, Ticker→Quote polled per minute (3 requests per pair); backfill limited to Kraken's latest 720 intervals."
    rate_limit: {per_second: 0.5, burst: 2}
    # spec 41 §6.2 knowledge time: trades reach the bus after their event time (per-minute polling
    # behind the rate limit). Measured 2026-11-11 on the MD stream (fa-backtest example
    # knowledge_delay, 907 trades): p50 43 s, p90 76 s, p99 87 s, max 117 s. Event-time replays
    # (fa_backtest::knowledge) shift Kraken series by this so they never look ahead.
    backfill:
      knowledge_delay_secs: 120
    config:
      symbols: [XBTEUR, ETHEUR, SOLEUR]
      timeframe: 1m
