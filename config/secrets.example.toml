# Copy to config/secrets.toml (git-ignored). Env vars FA_<SOURCE>_<KEY> override (D-020).

[garage]
access_key_id = ""
secret_access_key = ""

[sources.lemon]
api_key = ""

[sources.oanda]
api_key = ""
account_id = ""

# The OpenAI-compatible endpoint the LLM suite calls (D-117). Written here by
# `PUT /api/llm/endpoint` when it is entered in the agent tab; no route ever returns it.
[llm]
api_key = ""

# Trading credentials, per execution venue (D-121). Deliberately separate from `[sources.<id>]`
# above: a venue is usually both a data source and an execution venue, and a key that may only
# read market data must not become a key that can place orders because one section was convenient.
# Only the broker-gateway reads these. `FA_VENUES_<ID>_<KEY>` overrides each value.
#
# The trading mode cannot be switched to `live` while the venues report no credentials, and the
# risk engine additionally needs `[limits.live] sleeve_eur` / `max_order_eur` in `risk.toml` —
# the owner's numbers, which nothing on the bus can supply.
[venues.kraken]
api_key = ""
api_secret = "" # base64, as Kraken issues it
[venues.lemon]
api_key = ""
[venues.oanda]
api_key = ""
account_id = ""
env = "practice" # practice | live
