[package]
name = "fa-decoders"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
fa-core.workspace = true
fa-expert-space.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

# The neural families (`neural`) always build on candle's CPU backend (ADR 0003, pure Rust).
# `cuda` moves training/serving onto a CUDA device when one is present (off by default: no GPU
# on the dev host). `burn` / `candle` are kept as no-op markers for older build scripts.
[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
burn = []
candle = []
