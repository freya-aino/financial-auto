syntax = "proto3";

package fa.v1;

import "google/protobuf/timestamp.proto";

// ExposureDistribution: a strategy's target exposure per asset (spec 35).
message ExposureDistribution {
  string strategy_id = 1;
  string genome_id = 2;
  string horizon = 3;
  google.protobuf.Timestamp as_of = 4;
  repeated AssetExposure exposures = 5;
}

message AssetExposure {
  string instrument_id = 1;
  double mean = 2; // in [-1, 1] of the strategy's allocation
  double stddev = 3;
}
