syntax = "proto3";

package fa.v1;

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

message Trade {
  double price = 1;
  double size = 2;
  Side aggressor = 3;
  string venue_trade_id = 4;
}

message Quote {
  double bid_price = 1;
  double bid_size = 2;
  double ask_price = 3;
  double ask_size = 4;
}

message Bar {
  string timeframe = 1; // e.g. "1m", "1h", "1d"
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double volume = 6;
  optional double vwap = 7;
  uint64 trade_count = 8;
  bool adjusted = 9; // corporate-action adjusted (spec 12)
}

message BookLevel {
  double price = 1;
  double size = 2;
}

message BookSnapshot {
  repeated BookLevel bids = 1;
  repeated BookLevel asks = 2;
  uint64 sequence = 3;
}
