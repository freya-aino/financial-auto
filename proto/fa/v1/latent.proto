syntax = "proto3";

package fa.v1;

import "google/protobuf/timestamp.proto";

message ExpertSpaceRef {
  string snapshot_id = 1;
  string timescale = 2;
  uint32 expert_index = 3;
}

// LatentState is the decoder/strategy-facing expert view (spec 32).
message LatentState {
  string snapshot_id = 1;
  string timescale = 2;
  string instrument_id = 3; // or asset-set id
  google.protobuf.Timestamp as_of = 4;
  repeated ExpertLatent experts = 5;
  repeated float router_weights = 6;
}

message ExpertLatent {
  uint32 expert_index = 1;
  repeated float mean = 2;
  repeated float log_var = 3;
  string region_id = 4;
  string region_lineage_id = 5; // stable across generations (D-007)
}

message RegionEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CREATED = 1;
    KIND_MERGED = 2;
    KIND_SPLIT = 3;
    KIND_RETIRED = 4;
  }
  Kind kind = 1;
  ExpertSpaceRef space = 2;
  string region_id = 3;
  string lineage_id = 4;
  repeated string related_region_ids = 5;
}

message TransitionUpdate {
  ExpertSpaceRef space = 1;
  string from_region_id = 2;
  repeated TransitionProb to = 3;
  string sampler_id = 4;
  google.protobuf.Timestamp as_of = 5;
}

message TransitionProb {
  string region_id = 1;
  double mean = 2;
  double lower = 3; // credible interval
  double upper = 4;
}
